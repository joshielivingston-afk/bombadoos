<title>Bombadoos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400&display=swap">
<style>
/* Layout: three columns side by side above the clouds — spontaneous, deep, archetypal; each list is a cloud of buttons. */
:root {
  --sky-top: #cfe8ff;
  --sky-low: #ffffff;
  --fg: #1f4468;
  --muted: #6f93b5;
  --line: #bcdaf5;
  --btn: rgba(255,255,255,.75);
  --item: rgba(255,255,255,.94);
  --glow: 120, 190, 255;   /* rgb of the returning-light */
  --display: "Italiana", "Didot", "Bodoni 72", Georgia, serif;
  --body: "Jost", "Futura", "Avenir Next", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --sky-top: #0c1f36; --sky-low: #183452; --fg: #e8f4ff; --muted: #8fb3d6; --line: #2d5379;
  --btn: rgba(255,255,255,.06); --glow: 150, 205, 255; color-scheme: dark } }
:root[data-theme="dark"] {
  --sky-top: #0c1f36; --sky-low: #183452; --fg: #e8f4ff; --muted: #8fb3d6; --line: #2d5379;
  --btn: rgba(255,255,255,.06); --glow: 150, 205, 255; color-scheme: dark }

html, body { min-height: 100%; }
body {
  background: linear-gradient(180deg, var(--sky-top), var(--sky-low)) fixed;
  background-color: var(--sky-top);
  color: var(--fg); font-family: var(--body); font-weight: 300; font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent; overflow-x: hidden;
}
.clouds, .clouds::before, .clouds::after { position: fixed; inset: -25%; pointer-events: none; z-index: 0; }
.clouds { opacity: .9; filter: blur(18px);
  background:
    radial-gradient(28% 14% at 18% 28%, rgba(255,255,255,.95), transparent 70%),
    radial-gradient(22% 10% at 30% 34%, rgba(255,255,255,.85), transparent 70%),
    radial-gradient(30% 13% at 78% 58%, rgba(255,255,255,.9), transparent 70%),
    radial-gradient(18% 9% at 66% 63%, rgba(255,255,255,.75), transparent 70%),
    radial-gradient(40% 18% at 48% 96%, rgba(255,255,255,1), transparent 70%);
  animation: drift 90s ease-in-out infinite alternate; }
.clouds::before { content: ""; filter: blur(30px); opacity: .8;
  background:
    radial-gradient(26% 11% at 70% 18%, rgba(255,255,255,.85), transparent 70%),
    radial-gradient(34% 14% at 12% 74%, rgba(255,255,255,.8), transparent 70%);
  animation: drift2 120s ease-in-out infinite alternate; }
.clouds::after { content: "";
  background: radial-gradient(45% 35% at 50% 0%, rgba(255,255,255,.5), transparent 70%); }
@keyframes drift { to { transform: translate(6%, -4%) scale(1.08); } }
@keyframes drift2 { to { transform: translate(-8%, 3%) scale(1.1); } }

/* ---- living sky: phase (time of day), weather, season ---- */
:root { --sky-mid: var(--sky-low); --cloud: .9; }
body[data-phase="dawn"]    { --sky-top: #e9dcf3; --sky-mid: #f6e1ec; --sky-low: #ffeadf; --fg: #4b4466; --muted: #8a7fa6; --line: #e6d8ec; --btn: rgba(255,255,255,.6); --item: rgba(255,255,255,.92); --glow: 255, 200, 215; --cloud: .55; color-scheme: light; }
body[data-phase="day"]     { --sky-top: #3aa6ff; --sky-mid: #8dd0ff; --sky-low: #d6efff; --fg: #0c2d4f; --muted: #2d6596; --line: rgba(255,255,255,.85); --btn: rgba(255,255,255,.85); --item: rgba(255,255,255,.94); --glow: 255, 236, 170; --cloud: 1; color-scheme: light; }
body[data-phase="evening"] { --sky-top: #27336e; --sky-mid: #a5577e; --sky-low: #ffb067; --fg: #fff5ec; --muted: #ffdcc4; --line: rgba(255,255,255,.3);  --btn: rgba(255,255,255,.14); --item: rgba(66,54,108,.92); --glow: 255, 190, 120; --cloud: .35; color-scheme: dark; }
body[data-phase="night"]   { --sky-top: #030817; --sky-mid: #0a1631; --sky-low: #172b52; --fg: #e6eeff; --muted: #93a8d4; --line: rgba(255,255,255,.14); --btn: rgba(255,255,255,.06); --item: rgba(18,34,68,.93); --glow: 150, 190, 255; --cloud: .07; color-scheme: dark; }
body[data-phase] .clouds { opacity: var(--cloud); }
body[data-weather="cloudy"] { --cloud: 1; }
.skybg, .weathertint, #skycanvas, .sun { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.skybg { background: linear-gradient(180deg, var(--sky-top), var(--sky-mid) 55%, var(--sky-low)); transition: filter 4s; }
body[data-season="winter"] .skybg { filter: saturate(.8) brightness(1.04); }
body[data-season="spring"] .skybg { filter: hue-rotate(-6deg) saturate(1.05); }
body[data-season="summer"] .skybg { filter: saturate(1.18); }
body[data-season="autumn"] .skybg { filter: sepia(.18) saturate(1.1); }
.weathertint { opacity: 0; transition: opacity 4s; background: linear-gradient(180deg, #6f7f93, #a9b4c2); }
body[data-weather="cloudy"] .weathertint { opacity: .22; }
body[data-weather="rain"] .weathertint { opacity: .42; }
body[data-weather="snow"] .weathertint { opacity: .18; background: #e9eef5; }
#skycanvas { width: 100%; height: 100%; }
.sun { inset: auto; left: 68%; top: 0; width: 46vmin; height: 46vmin; margin: -23vmin 0 0 -23vmin; border-radius: 50%; opacity: 0;
  transition: top 60s linear, opacity 4s; }
body[data-phase="evening"] .sun { opacity: 1; background: radial-gradient(circle, #fff2c6 0 14%, #ffc46b 22%, rgba(255,140,80,.55) 40%, rgba(255,120,90,.18) 60%, transparent 72%); }
body[data-phase="dawn"] .sun { opacity: .75; background: radial-gradient(circle, #fffaf0 0 10%, rgba(255,214,222,.7) 26%, rgba(255,220,230,.25) 50%, transparent 70%); }
body[data-phase="day"] .sun { opacity: .9; background: radial-gradient(circle, #ffffff 0 9%, rgba(255,255,235,.75) 18%, rgba(255,255,255,.25) 40%, transparent 65%); }
body[data-phase="night"] .sun { opacity: .9; width: 10vmin; height: 10vmin; margin: -5vmin 0 0 -5vmin;
  background: radial-gradient(circle, #f4f6ff 0 38%, rgba(220,230,255,.35) 46%, transparent 70%); }
body[data-weather="rain"] .sun, body[data-weather="cloudy"] .sun { opacity: .25; }
main, .centerbar, .sound { z-index: 2; }
body:has(#overlay .over, #centerspace .over, #signin .over) main { visibility: hidden; }
body:has(#signin .over) .centerbar, body:has(#overlay .timer) .centerbar { display: none; }
.signin { z-index: 9; }
.signin form { display: flex; gap: .5rem; justify-content: center; }
.signin input { font: inherit; color: var(--fg); background: var(--btn); border: 1px solid var(--line); border-radius: 18px; padding: .7rem 1rem; width: min(70vw, 18rem); }
.signin form button { font-size: 1.3rem; width: 48px; border-radius: 18px; background: var(--btn); border: 1px solid var(--line); }
.signin .local { color: var(--muted); font-size: .8rem; letter-spacing: .2em; justify-self: center; padding: .5rem; }
.dice { justify-self: center; font-size: 1.4rem; width: 48px; height: 48px; border-radius: 50%; color: var(--fg);
  background: var(--btn); border: 1px solid var(--line); transition: transform .4s; }
.dice:hover { transform: rotate(72deg); }

main { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding-block: 6vh 6rem; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 1px solid var(--muted); outline-offset: 4px; border-radius: 6px; }

.word { font-family: var(--display); font-weight: 400; font-size: clamp(3.2rem, 12vw, 6rem);
  text-align: center; letter-spacing: .02em; margin: 14vh 0 3.5rem; line-height: 1;
  text-shadow: 0 0 40px rgba(var(--glow), .6); animation: breathe 8s ease-in-out infinite; }
@keyframes breathe { 50% { text-shadow: 0 0 70px rgba(var(--glow), .95); } }

.doors { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(.5rem, 2vw, 1.2rem); max-width: 720px; margin: 0 auto 3rem; }
.door { font-family: var(--display); font-size: clamp(.95rem, 3.9vw, 1.9rem); letter-spacing: .02em; padding: 1.1rem .3rem; white-space: nowrap; text-align: center;
  border-radius: 22px; background: color-mix(in srgb, var(--sky-low) 82%, #ffffff 18%); border: 1px solid var(--line); min-width: 0; overflow-wrap: anywhere;
  transition: box-shadow .5s, background .5s, transform .25s; }
.door:hover { transform: translateY(-2px); }
.door[aria-pressed="true"] { background: color-mix(in srgb, rgb(var(--glow)) 30%, var(--sky-low)); border-color: rgba(var(--glow), .9); box-shadow: 0 0 40px 4px rgba(var(--glow), .5); }
.panel { max-width: 820px; margin: 0 auto; display: grid; gap: 1.2rem; }
.panel[data-fresh] { animation: rise .6s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
.arch { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2.5rem; align-items: start; }
@media (max-width: 600px) { .arch { grid-template-columns: minmax(0, 1fr); } }
.arch .sub { margin: 0; }
.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(1.5rem, 4vw, 3.5rem); align-items: start; }
@media (max-width: 760px) { .cols { grid-template-columns: minmax(0, 1fr); gap: 3rem; } }
.col { min-width: 0; display: grid; gap: 1.2rem; align-content: start; }
.col h2 { font-family: var(--display); font-weight: 400; font-size: 1.9rem; margin: 0; text-align: center; letter-spacing: .04em; }
.sub { font-size: .75rem; letter-spacing: .3em; color: var(--muted); text-align: center; margin: .6rem 0 0; }
.btns { display: flex; flex-wrap: wrap; justify-content: center; gap: .55rem; }
.item { display: inline-flex; flex-direction: row; flex-wrap: wrap; align-items: baseline; justify-content: center; column-gap: .5rem; row-gap: 0; text-align: center;
  padding: .65rem 1.1rem; border-radius: 18px; background: var(--item); border: 1px solid var(--line);
  user-select: none; -webkit-user-select: none; max-width: 100%;
  transition: transform .25s, box-shadow .6s, background .6s; }
.item:hover { transform: translateY(-2px); }
.item:active { transform: scale(.96); }
.item .name { font-size: 1rem; line-height: 1.25; overflow-wrap: anywhere; }
.item .since { font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.item .remove { font-size: .72rem; color: #c0546a; letter-spacing: .15em; }
.item.lifted { animation: lift .7s ease; }
@keyframes lift { from { transform: translateY(10px); opacity: .3; } }
.add { display: flex; justify-content: center; }
.add input { width: 100%; max-width: 14rem; font: inherit; text-align: center; color: var(--fg); background: transparent; border: 0;
  border-bottom: 1px dashed var(--line); padding: .5rem; outline: none; }
.add input::placeholder { color: var(--muted); }
.note { color: var(--muted); text-align: center; font-size: .9rem; margin: 0 0 2rem; }

/* overlays */
.over { position: fixed; inset: 0; z-index: 5; display: grid; place-content: center; text-align: center; gap: 1.5rem;
  background: transparent; animation: fade .8s ease;
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px)); }
@keyframes fade { from { opacity: 0; } }
.over .big { font-family: var(--display); font-size: clamp(3rem, 14vw, 6rem); margin: 0; line-height: 1.05;
  text-shadow: 0 0 60px rgba(var(--glow), .9); overflow-wrap: anywhere; }
.over .small { color: var(--muted); letter-spacing: .3em; font-size: .9rem; margin: 0; }
.ring { width: min(70vw, 320px); aspect-ratio: 1; max-width: 100%; margin: 0 auto; display: block; }
.ring circle { fill: none; stroke-width: 1.5; }
.ring .track { stroke: var(--line); }
.ring .prog { stroke: rgb(var(--glow)); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset 1s linear; }
.timerwrap { position: relative; }
.timerwrap .clock { position: absolute; inset: 0; display: grid; place-content: center; margin: 0;
  font-family: var(--display); font-size: clamp(3rem, 15vw, 5.5rem); font-variant-numeric: tabular-nums; }
.done { letter-spacing: .3em; color: var(--fg); background: var(--btn); border: 1px solid var(--line); border-radius: 18px; padding: .7rem 1.8rem; justify-self: center; }
.leave { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: calc(14px + env(safe-area-inset-left, 0px)); font-family: var(--display); font-size: 1.6rem; color: var(--muted); padding: .3rem .6rem; }

main { padding-bottom: 0; }
.centerbar { position: relative; display: flex; justify-content: center;
  padding-block: clamp(2.5rem, 9vh, 5rem) calc(4rem + env(safe-area-inset-bottom, 0px)); }
.centerbtn { pointer-events: auto; width: min(100%, 640px); padding: 1.4rem 1rem; border-radius: 28px;
  font-family: var(--display); font-size: clamp(1.8rem, 6vw, 2.6rem); letter-spacing: .06em; color: var(--fg);
  background: color-mix(in srgb, var(--sky-low) 82%, #ffffff 18%); border: 1px solid var(--line); box-shadow: 0 0 40px rgba(var(--glow), .35);
  animation: soft 7s ease-in-out infinite; }
@keyframes soft { 50% { box-shadow: 0 0 70px rgba(var(--glow), .6); } }
.centering .centerbar { display: none; }
.center { z-index: 8; overflow: hidden; }
.center .orb { width: min(60vw, 60vh); aspect-ratio: 1; max-width: 100%; border-radius: 50%; margin: 0 auto;
  background: radial-gradient(circle, #ffffff 0%, rgba(var(--glow), .9) 35%, rgba(var(--glow), .25) 60%, transparent 72%);
  filter: blur(6px); animation: breath 11s ease-in-out infinite, hue 90s ease-in-out infinite alternate; }
@keyframes breath { 0%, 100% { transform: scale(.55); opacity: .55; } 45% { transform: scale(1.05); opacity: 1; } }
@keyframes hue { from { filter: blur(6px) hue-rotate(0deg); } to { filter: blur(6px) hue-rotate(40deg) brightness(1.15); } }
.center .small { position: absolute; left: 0; right: 0; bottom: calc(18vh + env(safe-area-inset-bottom, 0px)); letter-spacing: .5em; animation: fade 4s ease; }
.center.leaving { animation: out 3s ease forwards; }
@keyframes out { to { opacity: 0; } }
.sound { position: fixed; z-index: 6; right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: 44px; height: 44px; border-radius: 50%; color: var(--muted); font-size: 1.1rem; opacity: .7; }
.sound[aria-pressed="false"] { text-decoration: line-through; opacity: .4; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="skybg" aria-hidden="true"></div>
<div class="sun" aria-hidden="true"></div>
<canvas id="skycanvas" aria-hidden="true"></canvas>
<div class="clouds" aria-hidden="true"></div>
<div class="weathertint" aria-hidden="true"></div>
<main id="app"></main>
<div id="overlay"></div>
<button class="sound" id="sound" aria-pressed="true" aria-label="Music">♪</button>
<div class="centerbar"><button class="centerbtn" id="centerbtn">center first</button></div>
<div id="centerspace"></div>
<div id="signin"></div>

<script>
/* lists: spont = spontaneous, creative = deep (1h timer), archc + life = archetypal */
const HOUR = 3600e3;
let openDoor = null, panelFresh = false;
const RANDOM_LISTS = { spontaneous: ['spont'], deep: ['creative'], archetypal: ['archc', 'life'] };
document.addEventListener('click', e => {
  const r = e.target.closest('[data-random]'); if (!r) return;
  const pool = items.filter(i => RANDOM_LISTS[r.dataset.random].includes(i.list));
  if (pool.length) touch(pool[Math.floor(Math.random() * pool.length)].id, true);
});
document.addEventListener('click', e => {
  const d = e.target.closest('[data-door]'); if (!d) return;
  openDoor = openDoor === d.dataset.door ? null : d.dataset.door; panelFresh = true; render();
});
let db = null, items = [], timer = null, loaded = false, dbMissing = false, lastLifted = null;

const $ = (s, r = document) => r.querySelector(s);
/* Capital first letter, plus proper nouns wherever they appear. */
const PROPER = { spanish: 'Spanish', english: 'English', french: 'French', italian: 'Italian', portuguese: 'Portuguese',
  japanese: 'Japanese', german: 'German', antarctica: 'Antarctica', instagram: 'Instagram', tiktok: 'TikTok' };
function pretty(name) {
  const t = String(name).replace(/[A-Za-z]+/g, w => PROPER[w.toLowerCase()] || w);
  return t.charAt(0).toUpperCase() + t.slice(1);
}
/* One-time additions to saved lists. Each leaves a hidden marker row so it never runs twice
   (and never brings back something you removed). */
const MIGRATIONS = [
  { id: 'm-learning-spanish', add: { id: 'deep-learning-spanish', list: 'creative', name: 'Learn Spanish' } },
  { id: 'm-rename-edit-website', rename: { list: 'creative', from: 'editing this website', to: 'Edit this website' } },
  { id: 'm-rename-learn-spanish', rename: { list: 'creative', from: 'learning spanish', to: 'Learn Spanish' } },
];
let migrated = false;
async function runMigrations() {
  if (migrated || !db) return; migrated = true;
  for (const m of MIGRATIONS) {
    if (items.some(i => i.id === m.id)) continue;
    try {
      if (m.add) {
        const { id, ...row } = m.add;
        await db.collection('items').doc(id).set({ ...row, last: null, count: 0, created: Date.now() });
      }
      if (m.rename) {
        const r = m.rename;
        for (const it of items.filter(i => i.list === r.list && i.name.trim().toLowerCase() === r.from)) {
          it.name = r.to;
          await db.collection('items').doc(it.id).update({ name: r.to });
        }
      }
      await db.collection('items').doc(m.id).set({ list: '_meta', name: m.id, last: null, count: 0, created: 0 });
    } catch (e) { console.warn(e); }
  }
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

function since(t) {
  if (!t) return '·';
  const m = Math.floor((Date.now() - t) / 60000);
  if (m < 1) return 'now';
  if (m < 60) return m + 'm';
  const h = Math.floor(m / 60); if (h < 24) return h + 'h';
  const d = Math.floor(h / 24); if (d < 60) return d + 'd';
  const mo = Math.floor(d / 30); if (mo < 24) return mo + 'mo';
  return Math.floor(d / 365) + 'y';
}
function glowStyle(count) {
  const k = Math.min(1, Math.log1p(count || 0) / Math.log(25));
  if (!k) return '';
  return `box-shadow: 0 0 ${8 + 40 * k}px ${1 + 7 * k}px rgba(var(--glow), ${.2 + .55 * k});` +
         `background: color-mix(in srgb, rgb(var(--glow)) ${Math.round(10 + 35 * k)}%, var(--item)); border-color: rgba(var(--glow), ${.35 + .55 * k});`;
}

/* ---------- views ---------- */
function list(key) {
  const rows = items.filter(i => i.list === key)
    .sort((a, b) => (b.last || 0) - (a.last || 0) || (a.created || 0) - (b.created || 0));
  return `<div class="btns">${rows.map(i => `
    <button class="item ${i.id === lastLifted ? 'lifted' : ''}" data-id="${i.id}" style="${glowStyle(i.count)}">
      <span class="name">${esc(pretty(i.name))}</span>${i.last ? `<span class="since">${since(i.last)}</span>` : ''}
    </button>`).join('')}</div>
    ${loaded && !dbMissing ? `<form class="add" data-list="${key}"><input id="add-${key}" autocomplete="off" placeholder="+" aria-label="Add"></form>` : ''}`;
}
function render() {
  const focused = document.activeElement?.id;
  $('#app').innerHTML = `
    <h1 class="word">bombadoos</h1>
    ${dbMissing ? `<p class="note">Open this page signed in to claude.ai to save.</p>` : ''}
    <nav class="doors">${['spontaneous', 'deep', 'archetypal'].map(s =>
      `<button class="door" data-door="${s}" aria-pressed="${openDoor === s}">${s}</button>`).join('')}</nav>
    ${openDoor ? `<section class="panel" ${panelFresh ? 'data-fresh' : ''}>
      <button class="dice" data-random="${openDoor}" aria-label="Pick one for me">✦</button>${
      openDoor === 'spontaneous' ? list('spont') :
      openDoor === 'deep' ? list('creative') :
      `<div class="arch"><div class="col"><p class="sub">creative</p>${list('archc')}</div>
       <div class="col"><p class="sub">life</p>${list('life')}</div></div>`}</section>` : ''}`;
  panelFresh = false;
  lastLifted = null;
  if (focused && focused.startsWith('add-')) $('#' + focused)?.focus();
  renderTimer();
}

function showOverlay(html, onTap) {
  const o = $('#overlay');
  o.innerHTML = `<div class="over">${html}</div>`;
  if (onTap) o.firstChild.addEventListener('click', onTap);
}
function closeOverlay() { $('#overlay').innerHTML = ''; }

let tickId = null;
function renderTimer() {
  const o = $('#overlay');
  if (!timer) { if (o.querySelector('.timer')) closeOverlay(); return; }
  if (leftTimer) return;  // you stepped away; it keeps running until you return to its task (or sit idle)
  if (!o.querySelector('.timer')) {
    const C = 2 * Math.PI * 48;
    o.innerHTML = `<div class="over timer">
      <button class="leave" aria-label="Back">←</button>
      <p class="small">${esc(pretty(timer.name))}</p>
      <div class="timerwrap"><svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="48"/><circle class="prog" cx="50" cy="50" r="48"
        stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><p class="clock"></p></div>
      <button class="done">end</button></div>`;
    o.querySelector('.leave').onclick = () => { leftTimer = true; closeOverlay(); };
    o.querySelector('.done').onclick = finishTimer;
  }
  tick();
}
let leftTimer = false, chimed = false;
function tick() {
  if (!timer) return;
  const el = Date.now() - timer.start, left = HOUR - el;
  if (left <= 0 && !chimed) { chimed = true; if (el < HOUR + 120000) Music.chime(); }
  const o = $('#overlay .timer'); if (!o) return;
  const t = Math.abs(left), mm = Math.floor(t / 60000), ss = Math.floor(t / 1000) % 60;

/* ---------- music: a soft, slow, celestial pad ---------- */
const Music = (() => {
  let ctx, master, on = true, started = false;
  try { on = localStorage.getItem('music') !== 'off'; } catch {}
  const btn = $('#sound'); btn.setAttribute('aria-pressed', on);
  const chords = [[60,64,67,71,74],[57,60,64,67,71],[53,57,60,64,69],[55,59,62,67,74]];
  const bells = [72,74,76,79,81,84];
  const f = n => 440 * Math.pow(2, (n - 69) / 12);
  function reverb() {
    const len = ctx.sampleRate * 5, buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    const cv = ctx.createConvolver(); cv.buffer = buf; return cv;
  }
  function pad(notes, t, dur) {
    notes.forEach((n, i) => {
      [0, 6].forEach(det => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = i === 0 ? 'sine' : 'triangle'; o.frequency.value = f(i === 0 ? n - 12 : n); o.detune.value = det;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(.035, t + 3);
        g.gain.linearRampToValueAtTime(.03, t + dur - 2);
        g.gain.linearRampToValueAtTime(0, t + dur + 2);
        o.connect(g).connect(master); o.start(t); o.stop(t + dur + 2.2);
      });
    });
  }
  function bell(n, t, v = .05) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = f(n);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + 4);
    o.connect(g).connect(master); o.start(t); o.stop(t + 4.1);
  }
  let step = 0, next = 0;
  function loop() {
    if (!ctx) return;
    while (next < ctx.currentTime + 1) {
      pad(chords[step % chords.length], next, 8);
      for (let k = 0; k < 3; k++) if (Math.random() < .6)
        bell(bells[Math.floor(Math.random() * bells.length)], next + 1 + Math.random() * 6, .025 + Math.random() * .02);
      step++; next += 8;
    }
    setTimeout(loop, 500);
  }
  let chimeCtx = null;
  function start() {
    if (!chimeCtx) { try { chimeCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
    if (started || !on) return; started = true;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
      master = ctx.createGain(); master.gain.value = 0;
      const rv = reverb(), wet = ctx.createGain(), dry = ctx.createGain(); wet.gain.value = .7; dry.gain.value = .5;
      master.connect(lp); lp.connect(dry).connect(ctx.destination); lp.connect(rv).connect(wet).connect(ctx.destination);
      master.gain.linearRampToValueAtTime(.9, ctx.currentTime + 4);
      next = ctx.currentTime + .1; loop();
    } catch (e) { console.warn(e); }
  }
  btn.addEventListener('click', e => {
    e.stopPropagation();
    on = !on; btn.setAttribute('aria-pressed', on);
    try { localStorage.setItem('music', on ? 'on' : 'off'); } catch {}
    if (on && !started) start();
    else if (ctx && master) master.gain.linearRampToValueAtTime(on ? .9 : 0, ctx.currentTime + 1.5);
  });
  function chime() {
    const c = chimeCtx || ctx; if (!c) return;
    try { c.resume(); } catch {}
    const t = c.currentTime;
    [76, 79, 84, 88, 84, 88].forEach((n, i) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.value = f(n);
      g.gain.setValueAtTime(0, t + i * .4); g.gain.linearRampToValueAtTime(.18, t + i * .4 + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t + i * .4 + 3.5);
      o.connect(g).connect(c.destination); o.start(t + i * .4); o.stop(t + i * .4 + 3.6);
    });
  }
  return { start, chime };
})();

const LOCAL_KEY = 'bombadoos-db';
const SEED = [['spont','sand forming'],['spont','wave dancing'],['spont','tree climbing'],['spont','handstands'],
    ['spont','playing music'],['spont','filming / recording'],['spont','audio recording'],['spont','spontaneous drawing'],
    ['spont','writing'],['spont','poetry'],['spont','singing'],['spont','dancing'],
    ['creative','cave game'],['creative','Edit this website'],['creative','weekly youtube video'],
    ['life','working in antarctica'],['life','living / working on a boat']];
function localDb() {
  const KEY = LOCAL_KEY;
  let store;
  try { store = JSON.parse(localStorage.getItem(KEY)); } catch {}
  if (!store) {
    store = { items: {}, state: {} };
    SEED.forEach(([list, name], i) => store.items['s' + i] = { list, name, last: null, count: 0, created: i });
  }
  const subs = [];
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch {} subs.forEach(f => f()); };
  const meta = { fromCache: false, hasPendingWrites: false };
  const snapDoc = (id, d) => ({ id, exists: !!d, data: () => d && { ...d }, metadata: meta });
  const docRef = (col, id) => ({
    id,
    set: async v => { store[col][id] = { ...v }; save(); },
    update: async v => { if (!store[col][id]) throw { code: 'invalid_argument' }; Object.assign(store[col][id], v); save(); },
    delete: async () => { delete store[col][id]; save(); },
    onSnapshot: next => { const f = () => next(snapDoc(id, store[col][id])); subs.push(f); setTimeout(f); return () => subs.splice(subs.indexOf(f), 1); },
  });
  window.addEventListener('storage', e => { if (e.key === KEY) { try { store = JSON.parse(e.newValue) || store; } catch {} subs.forEach(f => f()); } });
  return {
    collection: col => ({
      doc: id => docRef(col, id || Math.random().toString(36).slice(2, 12)),
      onSnapshot: next => {
        const f = () => next({ docs: Object.entries(store[col] || {}).map(([id, d]) => snapDoc(id, d)), metadata: meta });
        subs.push(f); setTimeout(f); return () => subs.splice(subs.indexOf(f), 1);
      },
    }),
    doc: path => { const [col, id] = path.split('/'); return docRef(col, id); },
  };
}

/* ---------- living sky: local time, season, and (where allowed) local weather ---------- */
const Sky = (() => {
  const body = document.body, cv = $('#skycanvas'), cx = cv.getContext('2d'), sun = $('.sun');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let coords = null, sunTimes = null, weather = 'clear', phase = 'day', W = 0, H = 0, stars = [], drops = [];
  try { coords = JSON.parse(localStorage.getItem('sky-coords')); } catch {}
  const MIN = 60e3;

  function seasonOf(d) {
    const m = d.getMonth();
    let s = m === 11 || m < 2 ? 'winter' : m < 5 ? 'spring' : m < 8 ? 'summer' : 'autumn';
    if (coords && coords.lat < 0) s = { winter: 'summer', summer: 'winter', spring: 'autumn', autumn: 'spring' }[s];
    return s;
  }
  function sunToday(now) {
    const day = now.toDateString();
    if (sunTimes && sunTimes.day === day) return sunTimes;
    // No location: a gentle seasonal guess (mid-latitudes).
    const doy = (now - new Date(now.getFullYear(), 0, 0)) / 864e5;
    let swing = Math.cos((doy - 172) / 365 * 2 * Math.PI);  // +1 midsummer, -1 midwinter
    if (coords && coords.lat < 0) swing = -swing;
    const mid = new Date(now); mid.setHours(12, 45, 0, 0);
    const half = (6 + 1.8 * swing) * 60 * MIN;
    return { day, rise: +mid - half, set: +mid + half };
  }
  function update() {
    const now = new Date(), t = +now, { rise, set } = sunToday(now);
    let p, y;
    if (t >= rise - 50 * MIN && t < rise + 80 * MIN) { phase = 'dawn'; p = (t - (rise - 50 * MIN)) / (130 * MIN); y = 98 - p * 22; }
    else if (t >= rise + 80 * MIN && t < set - 90 * MIN) { phase = 'day'; p = (t - rise) / (set - rise); y = 34 - Math.sin(p * Math.PI) * 18; }
    else if (t >= set - 90 * MIN && t < set + 40 * MIN) { phase = 'evening'; p = (t - (set - 90 * MIN)) / (130 * MIN); y = 42 + p * 70; }
    else { phase = 'night'; y = 14; }
    body.dataset.phase = phase;
    body.dataset.season = seasonOf(now);
    body.dataset.weather = weather;
    sun.style.top = y + '%';
    seed();
  }
  function resize() {
    const r = devicePixelRatio || 1; W = innerWidth; H = innerHeight;
    cv.width = W * r; cv.height = H * r; cx.setTransform(r, 0, 0, r, 0, 0); seed(true);
  }
  function seed(force) {
    if (force || !stars.length) stars = Array.from({ length: Math.round(W * H / 2600) }, () =>
      ({ x: Math.random() * W, y: Math.random() * H * .85, r: Math.random() * 1.2 + .2, s: Math.random() * 6 }));
    const want = weather === 'rain' ? Math.round(W / 4) : weather === 'snow' ? Math.round(W / 9) : 0;
    if (drops.length !== want || force) drops = Array.from({ length: want }, () =>
      ({ x: Math.random() * W, y: Math.random() * H, v: weather === 'rain' ? 9 + Math.random() * 7 : .6 + Math.random() * 1.2, l: 8 + Math.random() * 14 }));
  }
  function frame(ts) {
    cx.clearRect(0, 0, W, H);
    const sec = ts / 1000;
    if (phase === 'night' || phase === 'evening' || phase === 'dawn') {
      const a = phase === 'night' ? 1 : .25;
      cx.fillStyle = '#ffffff';
      for (const s of stars) {
        if (phase !== 'night' && s.y > H * .35) continue;
        cx.globalAlpha = a * (.35 + .65 * Math.abs(Math.sin(sec * .6 + s.s)));
        cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 7); cx.fill();
      }
    }
    if (weather === 'rain') {
      cx.globalAlpha = .45; cx.strokeStyle = phase === 'night' ? '#9fb6dd' : '#ffffff'; cx.lineWidth = 1;
      cx.beginPath();
      for (const d of drops) { cx.moveTo(d.x, d.y); cx.lineTo(d.x - 2, d.y + d.l); d.y += d.v; d.x -= .3;
        if (d.y > H) { d.y = -d.l; d.x = Math.random() * W; } }
      cx.stroke();
    } else if (weather === 'snow') {
      cx.globalAlpha = .85; cx.fillStyle = '#ffffff';
      for (const d of drops) { cx.beginPath(); cx.arc(d.x, d.y, d.l / 8, 0, 7); cx.fill();
        d.y += d.v; d.x += Math.sin(sec + d.l) * .4; if (d.y > H) { d.y = -4; d.x = Math.random() * W; } }
    }
    cx.globalAlpha = 1;
    if (!reduce) requestAnimationFrame(frame);
  }
  async function fetchWeather() {
    if (!coords) return;
    try {
      const u = `https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}` +
        `&current=weather_code&daily=sunrise,sunset&timezone=auto&forecast_days=1`;
      const j = await (await fetch(u)).json();
      const c = j.current.weather_code;
      weather = (c >= 51 && c <= 67) || (c >= 80 && c <= 82) || c >= 95 ? 'rain'
        : (c >= 71 && c <= 77) || c === 85 || c === 86 ? 'snow'
        : c === 3 || c === 45 || c === 48 ? 'cloudy' : 'clear';
      sunTimes = { day: new Date().toDateString(), rise: +new Date(j.daily.sunrise[0]), set: +new Date(j.daily.sunset[0]) };
      update();
    } catch {}  // weather is a nicety; the sky still follows the clock without it
  }
  function locate() {
    try {
      navigator.geolocation.getCurrentPosition(pos => {
        coords = { lat: +pos.coords.latitude.toFixed(2), lon: +pos.coords.longitude.toFixed(2) };
        try { localStorage.setItem('sky-coords', JSON.stringify(coords)); } catch {}
        fetchWeather();
      }, () => {}, { timeout: 15000, maximumAge: 6 * 3600e3 });
    } catch {}
  }
  addEventListener('resize', resize);
  resize(); update(); requestAnimationFrame(frame);
  fetchWeather(); if (!coords) locate();
  setInterval(update, MIN);
  setInterval(fetchWeather, 30 * MIN);
  return { set(p, w) { if (p) body.dataset.phase = phase = p; if (w) { weather = w; body.dataset.weather = w; seed(); } } };
})();

  if (!db) db = localDb();

    items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!snap.metadata.fromCache) runMigrations();
    if (!snap.metadata.fromCache) { loaded = true; dbMissing = false; clearTimeout(loadTimer); }
    else loaded = true;
    if (!$('#overlay .over:not(.timer)')) render();
  }, () => { clearTimeout(loadTimer); dbMissing = true; render(); });
  db.doc('state/timer').onSnapshot(s => {
    const t = s.exists ? s.data() : null;
    const changed = (t && t.start) !== (timer && timer.start);
    timer = t;
    if (changed) { chimed = Date.now() - (t?.start || 0) > HOUR; if (t && !leftTimer) renderTimer(); if (!t) renderTimer(); }
  }, () => {});
})();
</script>
