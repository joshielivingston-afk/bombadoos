<title>Bombadoos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400&display=swap">
<style>
/* Layout: three columns side by side above the clouds — spontaneous, deep, archetypal; each list is a cloud of buttons. */
:root {
  --sky-top: #cfe8ff;
  --sky-low: #ffffff;
  --fg: #1f4468;
  --muted: #6f93b5;
  --line: #bcdaf5;
  --btn: rgba(255,255,255,.75);
  --glow: 120, 190, 255;   /* rgb of the returning-light */
  --display: "Italiana", "Didot", "Bodoni 72", Georgia, serif;
  --body: "Jost", "Futura", "Avenir Next", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --sky-top: #0c1f36; --sky-low: #183452; --fg: #e8f4ff; --muted: #8fb3d6; --line: #2d5379;
  --btn: rgba(255,255,255,.06); --glow: 150, 205, 255; color-scheme: dark } }
:root[data-theme="dark"] {
  --sky-top: #0c1f36; --sky-low: #183452; --fg: #e8f4ff; --muted: #8fb3d6; --line: #2d5379;
  --btn: rgba(255,255,255,.06); --glow: 150, 205, 255; color-scheme: dark }

html, body { min-height: 100%; }
body {
  background: linear-gradient(180deg, var(--sky-top), var(--sky-low)) fixed;
  background-color: var(--sky-top);
  color: var(--fg); font-family: var(--body); font-weight: 300; font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent; overflow-x: hidden;
}
.clouds, .clouds::before, .clouds::after { position: fixed; inset: -25%; pointer-events: none; z-index: 0; }
.clouds { opacity: .9; filter: blur(18px);
  background:
    radial-gradient(28% 14% at 18% 28%, rgba(255,255,255,.95), transparent 70%),
    radial-gradient(22% 10% at 30% 34%, rgba(255,255,255,.85), transparent 70%),
    radial-gradient(30% 13% at 78% 58%, rgba(255,255,255,.9), transparent 70%),
    radial-gradient(18% 9% at 66% 63%, rgba(255,255,255,.75), transparent 70%),
    radial-gradient(40% 18% at 48% 96%, rgba(255,255,255,1), transparent 70%);
  animation: drift 90s ease-in-out infinite alternate; }
.clouds::before { content: ""; filter: blur(30px); opacity: .8;
  background:
    radial-gradient(26% 11% at 70% 18%, rgba(255,255,255,.85), transparent 70%),
    radial-gradient(34% 14% at 12% 74%, rgba(255,255,255,.8), transparent 70%);
  animation: drift2 120s ease-in-out infinite alternate; }
.clouds::after { content: "";
  background: radial-gradient(45% 35% at 50% 0%, rgba(255,255,255,.5), transparent 70%); }
@keyframes drift { to { transform: translate(6%, -4%) scale(1.08); } }
@keyframes drift2 { to { transform: translate(-8%, 3%) scale(1.1); } }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .clouds { opacity: .12; } }
:root[data-theme="dark"] .clouds { opacity: .12; }

main { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding-block: 6vh 6rem; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 1px solid var(--muted); outline-offset: 4px; border-radius: 6px; }

.word { font-family: var(--display); font-weight: 400; font-size: clamp(3.2rem, 12vw, 6rem);
  text-align: center; letter-spacing: .02em; margin: 14vh 0 3.5rem; line-height: 1;
  text-shadow: 0 0 40px rgba(var(--glow), .6); animation: breathe 8s ease-in-out infinite; }
@keyframes breathe { 50% { text-shadow: 0 0 70px rgba(var(--glow), .95); } }

.doors { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(.5rem, 2vw, 1.2rem); max-width: 720px; margin: 0 auto 3rem; }
.door { font-family: var(--display); font-size: clamp(.95rem, 3.9vw, 1.9rem); letter-spacing: .02em; padding: 1.1rem .3rem; white-space: nowrap;
  border-radius: 22px; background: var(--btn); border: 1px solid var(--line); min-width: 0; overflow-wrap: anywhere;
  transition: box-shadow .5s, background .5s, transform .25s; }
.door:hover { transform: translateY(-2px); }
.door[aria-pressed="true"] { background: rgba(var(--glow), .3); border-color: rgba(var(--glow), .9); box-shadow: 0 0 40px 4px rgba(var(--glow), .5); }
.panel { max-width: 820px; margin: 0 auto; display: grid; gap: 1.2rem; }
.panel[data-fresh] { animation: rise .6s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
.arch { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2.5rem; align-items: start; }
@media (max-width: 600px) { .arch { grid-template-columns: minmax(0, 1fr); } }
.arch .sub { margin: 0; }
.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(1.5rem, 4vw, 3.5rem); align-items: start; }
@media (max-width: 760px) { .cols { grid-template-columns: minmax(0, 1fr); gap: 3rem; } }
.col { min-width: 0; display: grid; gap: 1.2rem; align-content: start; }
.col h2 { font-family: var(--display); font-weight: 400; font-size: 1.9rem; margin: 0; text-align: center; letter-spacing: .04em; }
.sub { font-size: .75rem; letter-spacing: .3em; color: var(--muted); text-align: center; margin: .6rem 0 0; }
.btns { display: flex; flex-wrap: wrap; justify-content: center; gap: .55rem; }
.item { display: inline-flex; flex-direction: column; align-items: center; gap: .1rem;
  padding: .65rem 1.1rem; border-radius: 18px; background: var(--btn); border: 1px solid var(--line);
  user-select: none; -webkit-user-select: none; max-width: 100%;
  transition: transform .25s, box-shadow .6s, background .6s; }
.item:hover { transform: translateY(-2px); }
.item:active { transform: scale(.96); }
.item .name { font-size: 1rem; line-height: 1.25; overflow-wrap: anywhere; }
.item .since { font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.item .remove { font-size: .72rem; color: #c0546a; letter-spacing: .15em; }
.item.lifted { animation: lift .7s ease; }
@keyframes lift { from { transform: translateY(10px); opacity: .3; } }
.add { display: flex; justify-content: center; }
.add input { width: 100%; max-width: 14rem; font: inherit; text-align: center; color: var(--fg); background: transparent; border: 0;
  border-bottom: 1px dashed var(--line); padding: .5rem; outline: none; }
.add input::placeholder { color: var(--muted); }
.note { color: var(--muted); text-align: center; font-size: .9rem; margin: 0 0 2rem; }

/* overlays */
.over { position: fixed; inset: 0; z-index: 5; display: grid; place-content: center; text-align: center; gap: 1.5rem;
  background: linear-gradient(180deg, var(--sky-top), var(--sky-low)); animation: fade .8s ease;
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px)); }
@keyframes fade { from { opacity: 0; } }
.over .big { font-family: var(--display); font-size: clamp(3rem, 14vw, 6rem); margin: 0; line-height: 1.05;
  text-shadow: 0 0 60px rgba(var(--glow), .9); overflow-wrap: anywhere; }
.over .small { color: var(--muted); letter-spacing: .3em; font-size: .9rem; margin: 0; }
.ring { width: min(70vw, 320px); aspect-ratio: 1; max-width: 100%; margin: 0 auto; display: block; }
.ring circle { fill: none; stroke-width: 1.5; }
.ring .track { stroke: var(--line); }
.ring .prog { stroke: rgb(var(--glow)); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset 1s linear; }
.timerwrap { position: relative; }
.timerwrap .clock { position: absolute; inset: 0; display: grid; place-content: center; margin: 0;
  font-family: var(--display); font-size: clamp(3rem, 15vw, 5.5rem); font-variant-numeric: tabular-nums; }
.done { letter-spacing: .3em; color: var(--fg); background: var(--btn); border: 1px solid var(--line); border-radius: 18px; padding: .7rem 1.8rem; justify-self: center; }
.leave { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: calc(14px + env(safe-area-inset-left, 0px)); font-family: var(--display); font-size: 1.6rem; color: var(--muted); padding: .3rem .6rem; }

main { padding-bottom: 11rem; }
.centerbar { position: fixed; z-index: 7; left: 0; right: 0; bottom: 0; display: flex; justify-content: center;
  padding: 1rem max(16px, env(safe-area-inset-right, 0px)) calc(1.2rem + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(0deg, var(--sky-low) 40%, transparent); pointer-events: none; }
.centerbtn { pointer-events: auto; width: min(100%, 640px); padding: 1.4rem 1rem; border-radius: 28px;
  font-family: var(--display); font-size: clamp(1.8rem, 6vw, 2.6rem); letter-spacing: .06em; color: var(--fg);
  background: var(--btn); border: 1px solid var(--line); box-shadow: 0 0 40px rgba(var(--glow), .35);
  animation: soft 7s ease-in-out infinite; }
@keyframes soft { 50% { box-shadow: 0 0 70px rgba(var(--glow), .6); } }
.centering .centerbar { display: none; }
.center { z-index: 8; overflow: hidden; }
.center .orb { width: min(60vw, 60vh); aspect-ratio: 1; max-width: 100%; border-radius: 50%; margin: 0 auto;
  background: radial-gradient(circle, #ffffff 0%, rgba(var(--glow), .9) 35%, rgba(var(--glow), .25) 60%, transparent 72%);
  filter: blur(6px); animation: breath 11s ease-in-out infinite, hue 60s linear forwards; }
@keyframes breath { 0%, 100% { transform: scale(.55); opacity: .55; } 45% { transform: scale(1.05); opacity: 1; } }
@keyframes hue { from { filter: blur(6px) hue-rotate(0deg); } to { filter: blur(6px) hue-rotate(40deg) brightness(1.15); } }
.center .small { position: absolute; left: 0; right: 0; bottom: calc(18vh + env(safe-area-inset-bottom, 0px)); letter-spacing: .5em; animation: fade 4s ease; }
.center.leaving { animation: out 3s ease forwards; }
@keyframes out { to { opacity: 0; } }
.sound { position: fixed; z-index: 6; right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(9.5rem + env(safe-area-inset-bottom, 0px));
  width: 44px; height: 44px; border-radius: 50%; color: var(--muted); font-size: 1.1rem; opacity: .7; }
.sound[aria-pressed="false"] { text-decoration: line-through; opacity: .4; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="clouds" aria-hidden="true"></div>
<main id="app"></main>
<div id="overlay"></div>
<button class="sound" id="sound" aria-pressed="true" aria-label="Music">♪</button>
<div class="centerbar"><button class="centerbtn" id="centerbtn">center first</button></div>
<div id="centerspace"></div>

<script>
/* lists: spont = spontaneous, creative = deep (1h timer), archc + life = archetypal */
const HOUR = 3600e3;
let openDoor = null, panelFresh = false;
document.addEventListener('click', e => {
  const d = e.target.closest('[data-door]'); if (!d) return;
  openDoor = openDoor === d.dataset.door ? null : d.dataset.door; panelFresh = true; render();
});
let db = null, items = [], timer = null, loaded = false, dbMissing = false, lastLifted = null;

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

function since(t) {
  if (!t) return '·';
  const m = Math.floor((Date.now() - t) / 60000);
  if (m < 1) return 'now';
  if (m < 60) return m + 'm';
  const h = Math.floor(m / 60); if (h < 24) return h + 'h';
  const d = Math.floor(h / 24); if (d < 60) return d + 'd';
  const mo = Math.floor(d / 30); if (mo < 24) return mo + 'mo';
  return Math.floor(d / 365) + 'y';
}
function glowStyle(count) {
  const k = Math.min(1, Math.log1p(count || 0) / Math.log(25));
  if (!k) return '';
  return `box-shadow: 0 0 ${8 + 40 * k}px ${1 + 7 * k}px rgba(var(--glow), ${.2 + .55 * k});` +
         `background: rgba(var(--glow), ${.08 + .32 * k}); border-color: rgba(var(--glow), ${.35 + .55 * k});`;
}

/* ---------- views ---------- */
function list(key) {
  const rows = items.filter(i => i.list === key)
    .sort((a, b) => (b.last || 0) - (a.last || 0) || (a.created || 0) - (b.created || 0));
  return `<div class="btns">${rows.map(i => `
    <button class="item ${i.id === lastLifted ? 'lifted' : ''}" data-id="${i.id}" style="${glowStyle(i.count)}">
      <span class="name">${esc(i.name)}</span><span class="since">${since(i.last)}</span>
    </button>`).join('')}</div>
    ${loaded && !dbMissing ? `<form class="add" data-list="${key}"><input id="add-${key}" autocomplete="off" placeholder="+" aria-label="Add"></form>` : ''}`;
}
function render() {
  const focused = document.activeElement?.id;
  $('#app').innerHTML = `
    <h1 class="word">bombadoos</h1>
    ${dbMissing ? `<p class="note">Open this page signed in to claude.ai to save.</p>` : ''}
    <nav class="doors">${['spontaneous', 'deep', 'archetypal'].map(s =>
      `<button class="door" data-door="${s}" aria-pressed="${openDoor === s}">${s}</button>`).join('')}</nav>
    ${openDoor ? `<section class="panel" ${panelFresh ? 'data-fresh' : ''}>${
      openDoor === 'spontaneous' ? list('spont') :
      openDoor === 'deep' ? list('creative') :
      `<div class="arch"><div class="col"><p class="sub">creative</p>${list('archc')}</div>
       <div class="col"><p class="sub">life</p>${list('life')}</div></div>`}</section>` : ''}`;
  panelFresh = false;
  lastLifted = null;
  if (focused && focused.startsWith('add-')) $('#' + focused)?.focus();
  renderTimer();
}

function showOverlay(html, onTap) {
  const o = $('#overlay');
  o.innerHTML = `<div class="over">${html}</div>`;
  if (onTap) o.firstChild.addEventListener('click', onTap);
}
function closeOverlay() { $('#overlay').innerHTML = ''; }

let tickId = null;
function renderTimer() {
  const o = $('#overlay');
  if (!timer) { if (o.querySelector('.timer')) closeOverlay(); return; }
  if (!o.querySelector('.timer')) {
    const C = 2 * Math.PI * 48;
    o.innerHTML = `<div class="over timer">
      <button class="leave" aria-label="Back">←</button>
      <p class="small">${esc(timer.name)}</p>
      <div class="timerwrap"><svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="48"/><circle class="prog" cx="50" cy="50" r="48"
        stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><p class="clock"></p></div>
      <button class="done" hidden>done</button></div>`;
    o.querySelector('.leave').onclick = () => { leftTimer = true; closeOverlay(); };
    o.querySelector('.done').onclick = finishTimer;
  }
  tick();
}
let leftTimer = false, chimed = false;
function tick() {
  const o = $('#overlay .timer'); if (!o || !timer) return;
  const el = Date.now() - timer.start, left = HOUR - el;
  const t = Math.abs(left), mm = Math.floor(t / 60000), ss = Math.floor(t / 1000) % 60;
  o.querySelector('.clock').textContent = (left < 0 ? '+' : '') + mm + ':' + String(ss).padStart(2, '0');
  const C = 2 * Math.PI * 48;
  o.querySelector('.prog').setAttribute('stroke-dashoffset', C * Math.max(0, left) / HOUR);
  o.querySelector('.done').hidden = left > 0;
  if (left <= 0 && !chimed) { chimed = true; if (el < HOUR + 5000) Music.chime(); }
}
setInterval(() => { tick(); }, 1000);
setInterval(() => { if (!$('#overlay .over') && !document.activeElement?.id?.startsWith('add-')) render(); }, 30000);

async function finishTimer() {
  const ref = db && db.doc('state/timer');
  timer = null; chimed = false; closeOverlay();
  try { await ref?.delete(); } catch {}
}

/* ---------- actions ---------- */
async function touch(id) {
  const it = items.find(i => i.id === id); if (!it) return;
  const now = Date.now();
  lastLifted = id;
  it.last = now; it.count = (it.count || 0) + 1;
  try { await db.collection('items').doc(id).update({ last: now, count: it.count }); } catch (e) { console.warn(e); }
  if (it.list === 'spont') {
    showOverlay(`<p class="big">enjoy</p>`, () => { closeOverlay(); render(); });
  } else if (it.list === 'creative') {
    timer = { id, name: it.name, start: now }; leftTimer = false; chimed = false;
    renderTimer();
    try { await db.doc('state/timer').set(timer); } catch (e) { console.warn(e); }
  } else {
    showOverlay(`<p class="big">${esc(it.name)}</p><p class="small">soon</p>`, () => { closeOverlay(); render(); });
  }
  render();
}
async function addItem(list, name) {
  name = name.trim(); if (!name || !db) return;
  const ref = db.collection('items').doc();
  lastLifted = ref.id;
  try { await ref.set({ list, name, last: null, count: 0, created: Date.now() }); }
  catch (e) { console.warn(e); }
}
async function removeItem(id) {
  try { await db.collection('items').doc(id).delete(); } catch (e) { console.warn(e); }
}

/* ---------- input ---------- */
let pressTimer = null, longPressed = false;
document.addEventListener('pointerdown', e => {
  Music.start();
  const b = e.target.closest('.item'); if (!b) return;
  longPressed = false;
  pressTimer = setTimeout(() => {
    longPressed = true;
    const s = b.querySelector('.since');
    s.outerHTML = `<span class="remove" data-remove="${b.dataset.id}">remove</span>`;
  }, 650);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev =>
  document.addEventListener(ev, () => clearTimeout(pressTimer), true));
document.addEventListener('contextmenu', e => { if (e.target.closest('.item')) e.preventDefault(); });
document.addEventListener('click', e => {
  const rm = e.target.closest('[data-remove]');
  if (rm) { removeItem(rm.dataset.remove); return; }
  const it = e.target.closest('.item');
  if (it) { if (longPressed) { longPressed = false; return; } touch(it.dataset.id); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('.add'); if (!f) return;
  e.preventDefault();
  const input = f.querySelector('input'); addItem(f.dataset.list, input.value); input.value = '';
  setTimeout(() => $('#add-' + f.dataset.list)?.focus(), 50);
});


/* ---------- music: a soft, slow, celestial pad ---------- */
const Music = (() => {
  let ctx, master, on = true, started = false;
  try { on = localStorage.getItem('music') !== 'off'; } catch {}
  const btn = $('#sound'); btn.setAttribute('aria-pressed', on);
  const chords = [[60,64,67,71,74],[57,60,64,67,71],[53,57,60,64,69],[55,59,62,67,74]];
  const bells = [72,74,76,79,81,84];
  const f = n => 440 * Math.pow(2, (n - 69) / 12);
  function reverb() {
    const len = ctx.sampleRate * 5, buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    const cv = ctx.createConvolver(); cv.buffer = buf; return cv;
  }
  function pad(notes, t, dur) {
    notes.forEach((n, i) => {
      [0, 6].forEach(det => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = i === 0 ? 'sine' : 'triangle'; o.frequency.value = f(i === 0 ? n - 12 : n); o.detune.value = det;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(.035, t + 3);
        g.gain.linearRampToValueAtTime(.03, t + dur - 2);
        g.gain.linearRampToValueAtTime(0, t + dur + 2);
        o.connect(g).connect(master); o.start(t); o.stop(t + dur + 2.2);
      });
    });
  }
  function bell(n, t, v = .05) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = f(n);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + 4);
    o.connect(g).connect(master); o.start(t); o.stop(t + 4.1);
  }
  let step = 0, next = 0;
  function loop() {
    if (!ctx) return;
    while (next < ctx.currentTime + 1) {
      pad(chords[step % chords.length], next, 8);
      for (let k = 0; k < 3; k++) if (Math.random() < .6)
        bell(bells[Math.floor(Math.random() * bells.length)], next + 1 + Math.random() * 6, .025 + Math.random() * .02);
      step++; next += 8;
    }
    setTimeout(loop, 500);
  }
  function start() {
    if (started || !on) return; started = true;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
      master = ctx.createGain(); master.gain.value = 0;
      const rv = reverb(), wet = ctx.createGain(), dry = ctx.createGain(); wet.gain.value = .7; dry.gain.value = .5;
      master.connect(lp); lp.connect(dry).connect(ctx.destination); lp.connect(rv).connect(wet).connect(ctx.destination);
      master.gain.linearRampToValueAtTime(.9, ctx.currentTime + 4);
      next = ctx.currentTime + .1; loop();
    } catch (e) { console.warn(e); }
  }
  btn.addEventListener('click', e => {
    e.stopPropagation();
    on = !on; btn.setAttribute('aria-pressed', on);
    try { localStorage.setItem('music', on ? 'on' : 'off'); } catch {}
    if (on && !started) start();
    else if (ctx && master) master.gain.linearRampToValueAtTime(on ? .9 : 0, ctx.currentTime + 1.5);
  });
  return { start, chime() { if (!ctx) return; const t = ctx.currentTime; [76,79,84,88].forEach((n,i) => bell(n, t + i * .35, .08)); } };
})();


/* ---------- center first: one quiet minute ---------- */
let centerEnd = null;
function leaveCenter() {
  const c = $('#centerspace .center'); if (!c) return;
  clearTimeout(centerEnd); c.classList.add('leaving');
  setTimeout(() => { $('#centerspace').innerHTML = ''; document.body.classList.remove('centering'); }, 3000);
}
$('#centerbtn').addEventListener('click', e => {
  e.stopPropagation(); Music.start();
  document.body.classList.add('centering');
  $('#centerspace').innerHTML = `<div class="over center"><button class="leave" aria-label="Back">←</button><div class="orb" aria-hidden="true"></div><p class="small">center</p></div>`;
  $('#centerspace .leave').onclick = ev => { ev.stopPropagation(); leaveCenter(); };
  centerEnd = setTimeout(leaveCenter, 60000);
});

/* ---------- local storage fallback (when opened outside claude.ai, e.g. GitHub Pages) ---------- */
function localDb() {
  const KEY = 'bombadoos-db';
  const SEED = [['spont','sand forming'],['spont','wave dancing'],['spont','tree climbing'],['spont','handstands'],
    ['spont','playing music'],['spont','filming / recording'],['spont','audio recording'],['spont','spontaneous drawing'],
    ['spont','writing'],['spont','poetry'],['spont','singing'],['spont','dancing'],
    ['creative','cave game'],['creative','editing this website'],['creative','make a youtube video'],
    ['life','working in antarctica'],['life','living / working on a boat']];
  let store;
  try { store = JSON.parse(localStorage.getItem(KEY)); } catch {}
  if (!store) {
    store = { items: {}, state: {} };
    SEED.forEach(([list, name], i) => store.items['s' + i] = { list, name, last: null, count: 0, created: i });
  }
  const subs = [];
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch {} subs.forEach(f => f()); };
  const meta = { fromCache: false, hasPendingWrites: false };
  const snapDoc = (id, d) => ({ id, exists: !!d, data: () => d && { ...d }, metadata: meta });
  const docRef = (col, id) => ({
    id,
    set: async v => { store[col][id] = { ...v }; save(); },
    update: async v => { if (!store[col][id]) throw { code: 'invalid_argument' }; Object.assign(store[col][id], v); save(); },
    delete: async () => { delete store[col][id]; save(); },
    onSnapshot: next => { const f = () => next(snapDoc(id, store[col][id])); subs.push(f); setTimeout(f); return () => subs.splice(subs.indexOf(f), 1); },
  });
  window.addEventListener('storage', e => { if (e.key === KEY) { try { store = JSON.parse(e.newValue) || store; } catch {} subs.forEach(f => f()); } });
  return {
    collection: col => ({
      doc: id => docRef(col, id || Math.random().toString(36).slice(2, 12)),
      onSnapshot: next => {
        const f = () => next({ docs: Object.entries(store[col] || {}).map(([id, d]) => snapDoc(id, d)), metadata: meta });
        subs.push(f); setTimeout(f); return () => subs.splice(subs.indexOf(f), 1);
      },
    }),
    doc: path => { const [col, id] = path.split('/'); return docRef(col, id); },
  };
}

/* ---------- data ---------- */
render();
(async () => {
  const loadTimer = setTimeout(() => { if (!loaded) { dbMissing = true; render(); } }, 10000);
  db = window.claude?.use ? await window.claude.use('db') : null;
  if (!db) db = localDb();
  db.collection('items').onSnapshot(snap => {
    items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!snap.metadata.fromCache) { loaded = true; dbMissing = false; clearTimeout(loadTimer); }
    else loaded = true;
    if (!$('#overlay .over:not(.timer)')) render();
  }, () => { clearTimeout(loadTimer); dbMissing = true; render(); });
  db.doc('state/timer').onSnapshot(s => {
    const t = s.exists ? s.data() : null;
    const changed = (t && t.start) !== (timer && timer.start);
    timer = t;
    if (changed) { chimed = Date.now() - (t?.start || 0) > HOUR; if (t && !leftTimer) renderTimer(); if (!t) renderTimer(); }
  }, () => {});
})();
